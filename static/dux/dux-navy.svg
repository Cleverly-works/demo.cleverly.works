<!--
  DUX brand mark — navy circle with white bulb.
  For use on light / paper backgrounds (e.g. the Agent dashboard
  header tile, the inbox splash).

  ⚠ PLACEHOLDER: vector approximation of the official DUX logo.
  Replace with the user-provided PNG/SVG at the same path
  (/static/dux/dux-navy.svg) — component code references this filename.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy circle background (Cleverly navy #1E2B5E) -->
  <circle cx="50" cy="50" r="50" fill="#1E2B5E"/>
  <!-- Bulb glass envelope -->
  <path
    d="M50 26c-11.04 0-20 8.96-20 20 0 6.66 3.25 12.55 8.25 16.18V67a2.86 2.86 0 002.85 2.86h17.8A2.86 2.86 0 0061.75 67v-4.82C66.75 58.55 70 52.66 70 46c0-11.04-8.96-20-20-20z"
    fill="#FFFFFF"
  />
  <!-- Base ridges -->
  <rect x="41.75" y="71.43" width="16.5" height="2.85" rx="0.7" fill="#FFFFFF"/>
  <rect x="42.85" y="75.7" width="14.3" height="2.85" rx="0.7" fill="#FFFFFF"/>
  <!-- Filament tip -->
  <path d="M45.7 79.3 L54.3 79.3 L50 84.3 Z" fill="#FFFFFF"/>
