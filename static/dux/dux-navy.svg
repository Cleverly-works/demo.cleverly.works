  <g fill="#1E2B5E">
    <path d="M51.4 43.7 L53.6 50.1 L60 52.1 L53.6 54.3 L51.4 60.7 L49.3 54.3 L42.9 52.1 L49.3 50.1 Z"/>
    <path d="M42.9 39.4 L44.3 42.1 L47.1 43.6 L44.3 45 L42.9 47.9 L41.4 45 L38.6 43.6 L41.4 42.1 Z"/>
    <path d="M55.7 38 L56.8 39.7 L58.6 40.7 L56.8 41.8 L55.7 43.6 L54.6 41.8 L52.9 40.7 L54.6 39.7 Z"/>
  </g>
</svg>
